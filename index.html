<title>E-SIMULA 24H Paddock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
/* E-SIMULA 24H Paddock · tema compartido por todas las pantallas (cabecera, menú, hero GT, escena, tarjetas). */
:root{--dam:#6a3fb5;--daw:#b7660a;--asix:#0e7c74;--dam-bg:#ece5f8;--daw-bg:#fbeedb;--asix-bg:#d9f1ee;--h1:#8fbaf7;--h2:#fff2dd;--h-ink:#14204f;--h-track:rgba(20,32,79,.14);--h-done:rgba(20,32,79,.38);--h-ring:#2b3a8c;--h-chip:rgba(255,255,255,.7);--h-chipb:rgba(20,32,79,.12);--h-hill:#9fb9e6;--h-hill2:#c3d3f0;--h-stand:#e3e9f8;--h-road1:#5d647c;--h-road2:#3f455c;--bg:#f3f4f8;--surface:#fff;--ink:#1b2340;--muted:#5d6580;--line:#dfe2ec;--brand:#2b3a8c;--brand-ink:#fff;
--good:#1d7a46;--good-bg:#dff3e7;--warn:#a4331f;--warn-bg:#fbe5e0;--amber:#a85d08;--amber-bg:#fbeedb;--info:#2b3a8c;--info-bg:#e4e8fb;--track:#e6e9f3;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 32px}

/* Cabecera */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0)}
.bar::after{content:"";display:block;height:4px;background:repeating-linear-gradient(90deg,#e10600 0 16px,var(--surface) 16px 32px)}
.bar .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.flag{flex:none;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.brand b{display:block;font-weight:800;font-size:1rem;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:520px){.brand b{font-size:.92rem}}
.usr{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex:none}
.usr:hover{border-color:var(--brand)}
.usr[hidden]{display:none}
.usr span{text-align:right;line-height:1.15;min-width:0}
.usr b{display:block;font-size:.92rem;white-space:nowrap}
.usr small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap}
.usr img{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block}
@media (max-width:420px){.usr span b{max-width:96px;overflow:hidden;text-overflow:ellipsis}}

/* Menú de pantallas del equipo */
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav span{flex:none;padding:8px 14px;border-radius:999px;font-size:.92rem;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.nav a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.nav span{opacity:.55;cursor:default}

.hero{position:relative;overflow:hidden;border-radius:22px;margin-top:12px;padding:24px;color:var(--h-ink);
background:radial-gradient(circle at 84% 24%,rgba(255,255,255,.85) 0 5%,rgba(255,255,255,0) 26%),linear-gradient(180deg,var(--h1) 0%,var(--h2) 100%);box-shadow:0 10px 30px rgba(43,58,140,.18)}
.hero::before{display:none}
.hero>*{position:relative}
.hgrid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:560px){.hgrid{grid-template-columns:1fr;justify-items:start;gap:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--h-chip);border:1px solid var(--h-chipb)}
.chip.live{background:#fff;color:#1c2766;display:inline-flex;align-items:center;gap:6px}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#1fbf6b;box-shadow:0 0 0 0 rgba(31,191,107,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,191,107,0)}100%{box-shadow:0 0 0 0 rgba(31,191,107,0)}}
@media (prefers-reduced-motion:reduce){.chip.live::before{animation:none}.ring .v{transition:none}}
.hero h1{margin:10px 0 2px;font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero .sub{margin:0;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card h2{font-size:.82rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px;font-weight:600}

/* Escena GT */
.lights{position:absolute;top:20px;right:20px;display:flex;gap:7px;padding:7px 10px;border-radius:12px;background:rgba(8,12,38,.55);border:1px solid rgba(255,255,255,.18)}
.lights i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.14);animation:lon .01s forwards,lgo .01s forwards 2.6s;animation-delay:calc(var(--i)*.4s),2.6s}
@keyframes lon{to{background:#ff2a1f;box-shadow:0 0 10px #ff2a1f}}
@keyframes lgo{to{background:#1fe07a;box-shadow:0 0 10px #1fe07a}}
@media (max-width:560px){.lights{top:16px;right:16px}.lights i{width:11px;height:11px}}
.bgs{position:absolute;left:0;right:0;bottom:51px;width:100%;height:120px}
.scene{position:relative;height:190px;margin:22px -24px -24px;overflow:hidden}
.road{position:absolute;left:0;right:0;bottom:0;height:42px;background:linear-gradient(var(--h-road1),var(--h-road2))}
.road::after{content:"";position:absolute;left:0;right:0;top:19px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 38px,transparent 38px 80px);opacity:.75;animation:run .9s linear infinite}
.kerb{position:absolute;left:0;right:0;bottom:42px;height:9px;background:repeating-linear-gradient(90deg,#e10600 0 26px,#fff 26px 52px);animation:run 1.1s linear infinite}
@keyframes run{to{background-position-x:-104px}}
.speed{position:absolute;left:0;right:46%;top:0;bottom:0;pointer-events:none}
.speed i{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));animation:zip 1.2s linear infinite}
.speed i:nth-child(1){top:46px;width:90px;left:12%;animation-delay:-.2s}
.speed i:nth-child(2){top:70px;width:140px;left:30%;animation-delay:-.7s}
.speed i:nth-child(3){top:94px;width:70px;left:6%;animation-delay:-.45s}
@keyframes zip{from{transform:translateX(-30px);opacity:0}30%{opacity:1}to{transform:translateX(120px);opacity:0}}
.car{position:absolute;right:3%;bottom:12px;width:min(600px,88%);height:auto;animation:bob 1.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-2px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lights i,.road::after,.kerb,.speed i,.car,.spin{animation:none}.lights i{background:#1fe07a}.speed{display:none}}
@media (max-width:560px){.scene{height:130px;margin-left:-24px}.car{width:92%;right:3%}}


/* Diseño claro fijo: sin modo oscuro, a propósito. */


/* Hero */
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--h-track);stroke-width:10}
.ring .v{fill:none;stroke:var(--h-ring);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring b{font-size:3.4rem;font-weight:800}.ring small{font-size:.8rem;opacity:.8;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.reto{margin:10px 0 0;font-weight:600}
.reto small{display:block;opacity:.7;font-weight:400;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}

/* Línea de carrera */
.race{margin-top:20px}
.race .rail{position:relative;height:14px;border-radius:99px;background:var(--h-track)}
.race .seg{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--h-ring),#e10600)}
.race .tk{display:flex;justify-content:space-between;font-size:.78rem;opacity:.8;margin-top:6px}
.seasonbar{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:20px}
.seasonbar i{height:6px;border-radius:3px;background:var(--h-track)}
.seasonbar i.d{background:var(--h-done)}.seasonbar i.n{background:#e10600;height:10px;margin-top:-2px}
.dl{margin-top:16px;display:inline-flex;gap:8px;align-items:center;font-size:.9rem;font-weight:600}

/* Tarjetas */
.cards{display:grid;gap:12px;margin-top:16px}
.k3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.k3{grid-template-columns:1fr 1fr}.k3 .k:last-child{grid-column:1/-1}}
.k small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.k b{display:block;font-size:1.9rem;line-height:1.15;font-weight:800;margin-top:2px;white-space:nowrap}
.k .dt{font-size:.85rem;font-weight:600}.up{color:var(--good)}.down{color:var(--warn)}.flat{color:var(--muted)}
.g2{grid-template-columns:1.15fr 1fr}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
@media (max-width:420px){.gauges{grid-template-columns:repeat(2,1fr);gap:14px}}
.gauge{position:relative;width:78px;height:78px;margin:0 auto}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .t{fill:none;stroke:var(--track);stroke-width:8}.gauge .v{fill:none;stroke:var(--brand);stroke-width:8;stroke-linecap:round}
.gauge.low .v{stroke:var(--warn)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.25rem;font-weight:800}
.gl{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.2}
.al{display:grid;gap:8px}
.a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;font-weight:600;font-size:.95rem;line-height:1.25}
.a i{flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.a.warn{background:var(--warn-bg);color:var(--warn)}.a.amber{background:var(--amber-bg);color:var(--amber)}.a.info{background:var(--info-bg);color:var(--info)}.a.good{background:var(--good-bg);color:var(--good)}
.resp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:.95rem;font-weight:600}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
.empty{margin:0;color:var(--muted);font-size:.95rem}


/* Clasificación */
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--track);margin:-4px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;font-weight:600;padding:7px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:30px 1fr auto 34px;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid transparent}
.rank li.mine{background:var(--info-bg);border-color:var(--brand)}
.rank .p{font-weight:800;font-size:1.1rem;text-align:center}
.rank li:first-child .p{color:#d99a00}
.rank .nm{min-width:0}
.rank .nm b{display:block;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .meter{height:6px;border-radius:99px;background:var(--track);margin-top:5px;overflow:hidden}
.rank .meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.rank .sc{font-weight:800;font-variant-numeric:tabular-nums}
.rank .mv{font-size:.8rem;font-weight:700;text-align:right}
.hintw{margin:12px 0 0;color:var(--muted);font-size:.8rem}
.demo{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;margin-top:24px}
.demo label{white-space:nowrap}
.demo select{max-width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
</style>

      idx: [['Tecnología', 50], ['Personas', 50], ['Calidad', 50], ['Finanzas', 50]],

      pos: 1 + Math.floor(rnd(r + 9) * 9), aband: rnd(r + 11) > .82
    };
  }
  function ring(pct, r, cls) {
    var C = 2 * Math.PI * r; return '<svg viewBox="0 0 ' + (r * 2 + 12) + ' ' + (r * 2 + 12) + '" aria-hidden="true"><circle class="t" cx="' + (r + 6) + '" cy="' + (r + 6) + '" r="' + r + '"/><circle class="v" cx="' + (r + 6) + '" cy="' + (r + 6) + '" r="' + r + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/></svg>';
  }
  function delta(a, b, inv, unit) {
    var d = a - b; if (!d) return '<span class="dt flat">= igual</span>';
    var good = inv ? d < 0 : d > 0;
    return '<span class="dt ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toLocaleString('es-ES') + (unit || '') + '</span>';
  }
  function alertas(c, p) {
    var a = [];
    if (c.t === 'carrera') a.push(['warn', 'Fija el riesgo antes de cerrar']);
    if (/Calor/.test(c.reto)) a.push(['amber', 'Calor: más averías si la calidad es baja']);
    if (/Lluvia/.test(c.reto)) a.push(['amber', 'Lluvia: manda el riesgo, no el ritmo']);
    if (/noche|Fatiga/.test(c.reto)) a.push(['amber', 'Noche: cuida los turnos']);
    if (c.t === 'junta') a.push(['info', 'Cierre semestral: ¿cambias de estrategia?']);
    if (c.r === 14) a.push(['info', 'La final puntúa doble']);
    if (c.r === 18) a.push(['info', 'Cierre anual y entrega de premios']);
    if (p && p.idx[3][1] < 50) a.push(['warn', 'Índice financiero bajo (' + p.idx[3][1] + ')']);
    if (p && p.aband) a.push(['warn', 'Abandono en la ronda anterior']);
    if (!a.length) a.push(['good', 'Sin alertas']);
    return a.slice(0, 4);
  }
  function resp(r) {
    if (r === 1) return [];
    if (r === 2) return [['Nova Energía', 'Aceptado', 'good'], ['Atlas Seguros', 'Rechazado', 'warn'], ['Piloto promesa', 'Fichado', 'good']];
    if (r === 9) return [['I+D Refrigeración', 'En curso', 'amber'], ['Nova Energía', 'En estudio', 'amber']];
    var ok = rnd(r + 20) > .5, pay = rnd(r + 21) > .3;
    return [['I+D Refrigeración', ok ? 'Completado' : 'En curso', ok ? 'good' : 'amber'], ['Nova Energía', pay ? 'Pago recibido' : 'Pago retenido', pay ? 'good' : 'warn']];
  }

  // Clasificación (datos de ejemplo). Ponderación del documento: 40 % empresa, 40 % estrategia, 20 % deporte.
  var EQUIPOS = ['Grupo Alfa', 'Grupo Beta', 'Grupo Gamma', 'Grupo Delta', 'Grupo Épsilon'];
  var YO = 0, mode = 'global';
  var MODOS = [['global', 'Final'], ['emp', 'Empresa'], ['est', 'Estrategia'], ['dep', 'Deporte']];
  function puntos(g, r, m) {
    return 50; // provisional: faltan las fórmulas de cálculo
  }
  function orden(r, m) { return EQUIPOS.map(function (_, g) { return { g: g, v: puntos(g, r, m) }; }).sort(function (a, b) { return b.v - a.v; }); }
  function clasif(n) {
    var h = '<section class="card" id="clasif" aria-labelledby="hc"><h2 id="hc">Clasificación</h2>';
    if (n < 2) return h + '<p class="empty">Aparece cuando se publique la primera ronda.</p></section>';
    var now = orden(n - 1, mode), before = n > 2 ? orden(n - 2, mode) : null;
    h += '<div class="a amber" style="margin-bottom:12px"><i></i>Faltan las fórmulas de cálculo: valores provisionales (50)</div>' + '<div class="seg" role="group" aria-label="Tipo de clasificación">' + MODOS.map(function (x) { return '<button type="button" data-mode="' + x[0] + '" aria-pressed="' + (mode === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div><ol class="rank">';
    now.forEach(function (x, i) {
      var mv = '';
      if (before) { var old = before.map(function (y) { return y.g; }).indexOf(x.g); var d = old - i; mv = d > 0 ? '<span class="mv up">▲' + d + '</span>' : d < 0 ? '<span class="mv down">▼' + Math.abs(d) + '</span>' : '<span class="mv flat">=</span>'; }
      h += '<li class="' + (x.g === YO ? 'mine' : '') + '"><span class="p">' + (i + 1) + '</span><span class="nm"><b>' + esc(EQUIPOS[x.g]) + (x.g === YO ? ' (tú)' : '') + '</b><span class="meter"><i style="width:' + x.v + '%"></i></span></span><span class="sc">' + x.v.toLocaleString('es-ES', { minimumFractionDigits: 1 }) + '</span>' + mv + '</li>';
    });
    return h + '</ol><p class="hintw">Final = 40 % empresa + 40 % estrategia + 20 % deporte.</p></section>';
  }

  function render(n) {
    var c = CAL[n - 1], prev = n > 1 ? res(n - 1) : null, ant = n > 2 ? res(n - 2) : null;
    var h = '';
    // HERO
    h += '<section class="hero" aria-labelledby="t"><div class="lights" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></div><div class="hgrid">' +
      '<div class="ring" role="img" aria-label="Ronda ' + c.r + ' de 18">' + ring(c.r / 18, 62) + '<div><b>' + c.r + '</b><small>de 18</small></div></div>' +
      '<div><div class="chips"><span class="chip live">Abierta</span><span class="chip">' + TIPO[c.t] + '</span><span class="chip">' + FASE[c.f] + '</span></div>' +
      '<h1 id="t">' + esc(c.n) + '</h1><p class="sub">' + esc(c.s) + (c.h ? ' · horas ' + c.h[0] + ' a ' + c.h[1] : '') + '</p>' +
      '<p class="reto"><small>Reto de gestión</small>' + esc(c.reto) + '</p></div></div>';
    if (c.h) {
      var l = c.h[0] / c.h[2] * 100, w = (c.h[1] - c.h[0]) / c.h[2] * 100;
      h += '<div class="race" role="img" aria-label="Este tramo cubre de la hora ' + c.h[0] + ' a la ' + c.h[1] + ' de ' + c.h[2]  + '"><div class="rail"><div class="seg" style="left:' + l + '%;width:' + w + '%"></div></div><div class="tk"><span>0 h</span><span>' + c.h[2] + ' h</span></div></div>';
    }
    h += '<div class="seasonbar" aria-hidden="true">' + CAL.map(function (x) { return '<i class="' + (x.r < n ? 'd' : x.r === n ? 'n' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="dl">⏱ Cierra el viernes a las 18:00 <span style="opacity:.6;font-weight:400">(ejemplo)</span></div>' + SCENE + '</section>';

    // KPIs
    if (prev) {
      var delNota = ant ? delta(prev.nota, ant.nota) : '<span class="dt flat">Ronda ' + (n - 1) + '</span>';
      var delTes = ant ? delta(Math.round((prev.tes - ant.tes) / 1000), 0, false, ' k€') : '<span class="dt flat">Ronda ' + (n - 1) + '</span>';
      var rondaPrev = CAL[n - 2];
      var third = rondaPrev.t === 'carrera'
        ? '<div class="card k"><small>Última carrera</small><b>' + (prev.aband ? 'Abandono' : prev.pos + '.º') + '</b><span class="dt ' + (prev.aband ? 'down' : 'flat') + '">' + esc(rondaPrev.s) + '</span></div>'
        : '<div class="card k"><small>Última ronda</small><b>' + esc(TIPO[rondaPrev.t]) + '</b><span class="dt flat">Ronda ' + (n - 1) + '</span></div>';
      h += '<div class="cards k3"><div class="card k"><small>Nota de gestión</small><b>' + prev.nota + '</b>' + delNota + '</div>' +
        '<div class="card k"><small>Tesorería</small><b>' + eur(prev.tes) + '</b>' + (ant ? delTes : '<span class="dt flat">Ronda ' + (n - 1) + '</span>') + '</div>' + third + '</div>';
    } else {
      h += '<div class="cards"><div class="card"><p class="empty">Primera ronda: aún no hay resultados. Recibes tu escudería y empiezas de cero.</p></div></div>';
    }

    // Clasificación + Índices
    h += '<div class="cards g2">' + clasif(n);
    h += '<section class="card" aria-labelledby="hi"><h2 id="hi">Índices de gestión</h2>' + '<div class="a amber" style="margin-bottom:12px"><i></i>Faltan las fórmulas de cálculo: valores provisionales (50)</div>';
    h += prev ? '<div class="gauges">' + prev.idx.map(function (x) {
      return '<div><div class="gauge' + (x[1] < 50 ? ' low' : '') + '" role="img" aria-label="' + x[0] + ': ' + x[1] + ' de 100">' + ring(x[1] / 100, 31) + '<b>' + x[1] + '</b></div><div class="gl">' + x[0] + '</div></div>';
    }).join('') + '</div>' : '<p class="empty">Se calculan al publicar la primera ronda.</p>';
    h += '</section></div>';

    // Alertas + Respuestas
    var rs = resp(n);
    h += '<div class="cards g2"><section class="card" aria-labelledby="ha"><h2 id="ha">Alertas</h2><div class="al">' +
      alertas(c, prev).map(function (a) { return '<div class="a ' + a[0] + '"><i></i>' + esc(a[1]) + '</div>'; }).join('') + '</div></section>' +
      '<section class="card" aria-labelledby="hr"><h2 id="hr">Respuestas a tus decisiones</h2>' +
      (rs.length ? '<div class="resp">' + rs.map(function (x) { return '<div class="r"><span>' + esc(x[0]) + '</span><span class="pill ' + x[2] + '">' + esc(x[1]) + '</span></div>'; }).join('') + '</div>' : '<p class="empty">Llegan a partir de la ronda 2.</p>') + '</section></div>';

    $('#app').innerHTML = h;
    document.title = 'Ronda ' + c.r + ' · E-SIMULA 24H Paddock';
  }

  var sel = $('#sel');
  sel.innerHTML = CAL.map(function (c) { return '<option value="' + c.r + '">' + c.r + ' · ' + esc(c.n) + (c.s && c.t === 'carrera' ? ' (' + c.s.toLowerCase() + ')' : '') + '</option>'; }).join('');
  var start = 5;
  try { var st = parseInt(localStorage.getItem('ronda'), 10); if (st >= 1 && st <= 18) start = st; } catch (e) {}
  try { var q = parseInt(new URLSearchParams(location.search).get('ronda'), 10); if (q >= 1 && q <= 18) start = q; } catch (e) {}
  sel.value = String(start);
  sel.addEventListener('change', function () { try { localStorage.setItem('ronda', sel.value); } catch (e) {} render(+sel.value); });
  $('#app').addEventListener('click', function (e) { var b = e.target.closest('[data-mode]'); if (b) { mode = b.getAttribute('data-mode'); document.getElementById('clasif').outerHTML = clasif(+sel.value); var nb = document.querySelector('[data-mode="' + mode + '"]'); if (nb) nb.focus(); } });
  render(start);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>

</body></html>
