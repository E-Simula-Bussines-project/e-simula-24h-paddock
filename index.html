<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-SIMULA 24H Paddock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Mundo único: garaje blanco de resistencia. Blanco luminoso + negro asfalto, rojo racing para la marca,
   azul eléctrico para el dinero, oro para el podio. Layout: escena a pantalla completa con tarjetas flotantes. */
:root{
  --paper:#ffffff; --mist:#f0f2f5; --ink:#0b0c10; --ink2:#5b6270; --line:#e1e4ea;
  --red:#e10600; --blue:#0a5cff; --gold:#f2b705; --good:#0f9d58; --loss:#d62839;
  --livery:#e10600;
  --f-display:"Russo One","Arial Black",sans-serif;
  --f-label:"Chakra Petch","Arial Narrow",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-label);font-variant-numeric:tabular-nums;font-weight:700}
.disp{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.lbl{font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* barra superior */
.top{position:sticky;top:0;z-index:50;height:64px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo b{font:400 17px/1 var(--f-display);letter-spacing:.02em}
.logo small{display:block;font:600 9px/1 var(--f-label);letter-spacing:.3em;color:var(--ink2);margin-top:4px}
.flag{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);padding:6px;gap:0}
.flag i{background:#fff}.flag i:nth-child(4n+1):nth-child(odd),.flag i.k{background:transparent}
nav{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav a{position:relative;padding:22px 16px;font:700 13px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;transition:color .15s}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:4px;background:var(--red);transform:skewX(-30deg)}
.status{display:flex;align-items:center;gap:14px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--ink);color:#fff;font:700 12px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.pill i{width:8px;height:8px;border-radius:50%;background:#2ee66b;box-shadow:0 0 0 3px rgba(46,230,107,.25)}
.who{font:600 13px var(--f-label);letter-spacing:.06em;color:var(--ink2);text-align:right;line-height:1.2}
.who b{display:block;color:var(--ink)}

/* escena (garaje) */
main{display:block}
.scene{position:relative;overflow:hidden;background:#eef0f4}
.scene>svg.bd{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene.tall{min-height:calc(100vh - 64px)}
.fade{position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
.stage{position:relative;z-index:2}

/* coche + plataforma */
.carwrap{position:relative}
.carwrap svg{display:block;width:100%;height:auto;overflow:visible}
.turn{position:absolute;left:3%;right:3%;top:53%;height:20%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.95) 0 55%,rgba(11,12,16,.9) 56% 70%,rgba(225,6,0,.95) 71% 74%,rgba(11,12,16,.0) 75%);
  filter:drop-shadow(0 10px 14px rgba(11,12,16,.28));z-index:0}
.carwrap .car{position:relative;z-index:1;animation:roll .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{transform:translateX(-60px)}to{transform:none}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.carwrap .car{animation:none}}

/* inicio */
.hero{min-height:calc(100vh - 64px);padding:28px 32px 28px;display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto 1fr auto;gap:0 28px}
.hero .head{grid-column:1;grid-row:1}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font:700 12px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(11,12,16,.06)}
.eyebrow em{font-style:normal;color:var(--red)}
.hero h1{font-size:clamp(40px,5.6vw,84px);line-height:.95;margin:16px 0 6px;color:var(--ink)}
.hero h1 span{color:var(--red)}
.hero .sub{font:600 14px var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.hero .cars{grid-column:1;grid-row:2;align-self:end;display:flex;justify-content:center;padding-top:12px}
.hero .cars .carwrap{width:min(1080px,112%);margin-left:-4%}
.hero .head{padding-top:30px}
.hero .cta{grid-column:1;grid-row:3;display:flex;justify-content:center;gap:14px;align-items:center;padding-top:8px;flex-wrap:wrap}
.hero .side{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:16px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:12px;padding:18px 34px;border-radius:14px;background:var(--ink);color:#fff;font:700 15px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .15s,background .15s}
.btn:hover{background:var(--red);transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:var(--ink)}
.btn.sm{padding:12px 22px;font-size:12px}

.card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 34px rgba(11,12,16,.09)}
.card.solid{background:#fff;backdrop-filter:none}
a.card,button.card{display:block;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
a.card:hover,button.card:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(11,12,16,.14)}
.card .ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.arrow{font:700 12px var(--f-label);letter-spacing:.12em;color:var(--blue)}
.bigmoney{font:400 38px/1 var(--f-display);letter-spacing:.01em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo>div{border-radius:12px;padding:10px 12px}
.duo .g{background:#e8f7ee}.duo .l{background:#fdebed}
.duo b{display:block;font:700 18px var(--f-label)}
.duo .g b{color:var(--good)}.duo .l b{color:var(--loss)}
.duo small{font:600 10px var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.mini-rank{display:flex;flex-direction:column;gap:6px}
.mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-weight:600}
.mr .p{font:700 15px var(--f-label)}
.mr.me{background:var(--ink);color:#fff}
.mr.gold .p{color:var(--gold)}
.mr .s{font:700 14px var(--f-label)}
.avrow{display:flex;gap:0;margin-top:2px}
.avrow .av{width:52px;height:52px;margin-right:-10px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:var(--mist)}
.callout{position:absolute;z-index:4;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font:600 12px/1.3 var(--f-label);letter-spacing:.06em;max-width:190px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.callout::after{content:"";position:absolute;left:22px;bottom:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.callout b{color:#ffb4ae}
.callout a{display:inline-block;margin-top:4px;color:#8fb5ff;letter-spacing:.1em}

/* páginas con cabecera de escena */
.pagehead{position:relative;min-height:340px;display:flex;align-items:flex-end}
.pagehead .stage{width:100%;max-width:1280px;margin:0 auto;padding:60px 32px 66px}
.pagehead h1{font-size:clamp(36px,5vw,64px);line-height:1;margin:8px 0}
.pagehead p{max-width:560px;color:var(--ink2);font-weight:500}
.page{max-width:1280px;margin:0 auto;padding:6px 32px 80px}
.sec{margin-top:34px}
.sec>h2{font:400 22px/1 var(--f-display);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.sec>h2::before{content:"";width:14px;height:22px;background:var(--red);transform:skewX(-20deg)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

/* medidores */
.meter{background:var(--mist);height:10px;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
.meter.red i{background:var(--red)}.meter.gold i{background:var(--gold)}.meter.good i{background:var(--good)}
.kpi{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.kpi .v{font:400 44px/1 var(--f-display);margin:10px 0 12px}
.kpi .v small{font:600 14px var(--f-label);color:var(--ink2)}
.tag{display:inline-block;padding:5px 10px;border-radius:99px;font:700 11px/1 var(--f-label);letter-spacing:.1em;text-transform:uppercase;background:var(--mist);color:var(--ink2)}
.tag.good{background:#e8f7ee;color:var(--good)}.tag.warn{background:#fff4d6;color:#8a6500}.tag.bad{background:#fdebed;color:var(--loss)}.tag.blue{background:#e6eeff;color:var(--blue)}

/* garaje */
.gar{padding:20px 32px 10px;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:end}
.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.25);display:grid;place-items:center;font:700 13px var(--f-label);z-index:5;transition:transform .15s,background .15s}
.hs::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--red);opacity:.0;animation:ping 2s ease-out infinite}
.hs.warn{border-color:var(--red)}.hs.warn::before{opacity:.8}
.hs:hover,.hs[aria-pressed="true"]{background:var(--ink);color:#fff;transform:scale(1.12)}
@keyframes ping{from{transform:scale(.7);opacity:.8}to{transform:scale(1.5);opacity:0}}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.wear{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.wear .meter{flex:1}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;transition:border-color .15s,background .15s}
.opt:hover{border-color:#b9c0cc}
.opt[aria-pressed="true"]{border-color:var(--blue);background:#f2f6ff}
.opt b{display:flex;justify-content:space-between;font-weight:700}
.opt small{display:block;color:var(--ink2);margin-top:3px;font-weight:500}
.opt .cost{font:700 13px var(--f-label);color:var(--blue)}

/* equipo */
.pc{position:relative;border-radius:22px;padding:0;overflow:hidden;background:linear-gradient(160deg,#fff 0%,#f3f5f9 60%,#e7ebf2 100%);border:1px solid var(--line);box-shadow:0 14px 30px rgba(11,12,16,.08);transition:transform .2s}
.pc:hover{transform:translateY(-4px) rotate(-.3deg)}
.pc .top2{position:relative;height:150px;background:linear-gradient(135deg,var(--ink) 0 58%,var(--cc,var(--red)) 58%);display:flex;justify-content:center;align-items:flex-end}
.pc .top2 .av{width:128px;height:128px}
.ovr{position:absolute;left:14px;top:12px;color:#fff;font:400 34px/1 var(--f-display)}
.ovr small{display:block;font:600 10px var(--f-label);letter-spacing:.2em;margin-top:4px;color:#cfd4de}
.stars{position:absolute;right:14px;top:14px;color:var(--gold);letter-spacing:2px;font-size:15px}
.pc .body{padding:14px 18px 18px}
.pc h3{font:400 18px/1.1 var(--f-display);text-transform:uppercase}
.pc .role{font:700 11px var(--f-label);letter-spacing:.16em;color:var(--cc,var(--red));text-transform:uppercase;margin:4px 0 12px}
.at{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:8px;margin:6px 0;font:600 12px var(--f-label);letter-spacing:.04em;color:var(--ink2)}
.at .meter{height:7px}.at b{color:var(--ink);text-align:right}
.pc .foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed #cdd3de;font:600 12px var(--f-label);color:var(--ink2)}
.pc .foot b{color:var(--ink);font-size:14px}
.av svg{display:block;width:100%;height:100%}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.hrow{margin:14px 0}
.hrow .t{display:flex;justify-content:space-between;font-weight:700}
.hrow .t span:last-child{font:700 18px var(--f-label)}
.hrow small{color:var(--ink2)}
.scout{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.scout .av{width:58px;height:58px;border-radius:50%;overflow:hidden;background:var(--mist);flex:none}
.scout div.i{flex:1;min-width:0}.scout b{display:block}.scout small{color:var(--ink2)}

/* finanzas */
.finhero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.finhero .stage{max-width:1280px;margin:0 auto;padding:40px 32px 36px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center}
.finhero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px)}
.finhero .stripe{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 40px,#fff 40px 80px)}
.finhero h1{font-size:clamp(30px,4vw,48px);margin:10px 0 4px}
.finhero .lbl{color:#9aa3b3}
.cash{font:400 clamp(44px,6.4vw,88px)/1 var(--f-display);margin:6px 0 4px}
.flow{display:grid;gap:14px}
.fbar{display:grid;grid-template-columns:90px 1fr 110px;gap:12px;align-items:center;font:700 13px var(--f-label);letter-spacing:.05em}
.fbar .tr{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.fbar .tr i{display:block;height:100%;border-radius:99px}
.fbar.g i{background:#34d17b}.fbar.l i{background:#ff5a67}
.fbar span:last-child{text-align:right}
.seal{display:flex;align-items:center;gap:18px;margin-top:22px;flex-wrap:wrap}
.sealbadge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold),#fff3c2,var(--gold));color:var(--ink);font:400 34px var(--f-display);box-shadow:0 0 0 5px rgba(242,183,5,.25)}
.sealbadge span{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#fff}
.dark-meter{background:rgba(255,255,255,.14)}
.listrow{display:grid;grid-template-columns:1fr 100px 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.listrow:last-child{border:0}
.listrow .meter{height:8px}
.listrow .num{text-align:right}
.dec{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sticky{position:sticky;top:84px}
.fc{margin:8px 0;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fc:last-of-type{border:0}
.delta{font:700 12px var(--f-label)}.delta.up{color:var(--good)}.delta.dn{color:var(--loss)}

/* clasificación */
.seg{display:inline-flex;background:var(--mist);border-radius:14px;padding:4px;gap:2px}
.seg button{padding:10px 18px;border-radius:11px;font:700 12px var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin:6px 0 28px}
.pod{border-radius:20px 20px 0 0;padding:18px 16px;text-align:center;color:#fff;position:relative;overflow:hidden}
.pod .pos{font:400 60px/1 var(--f-display);opacity:.95}
.pod h3{font:400 18px var(--f-display);text-transform:uppercase;margin:6px 0 2px}
.pod .num{font-size:22px}
.pod small{opacity:.75;font:600 11px var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.pod.p1{background:linear-gradient(160deg,#f2b705,#b88300);color:var(--ink);min-height:230px}
.pod.p2{background:linear-gradient(160deg,#2a2e38,#0b0c10);min-height:190px}
.pod.p3{background:linear-gradient(160deg,#e10600,#8f0400);min-height:160px}
.row{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,2fr) 70px;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.row.me{background:var(--ink);color:#fff;border-color:var(--ink)}
.row .p{font:400 24px var(--f-display)}
.row small{display:block;font:600 10px var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.row.me small{color:#aab2c0}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--mist)}
.stack i{display:block;height:100%}
.row.me .stack{background:rgba(255,255,255,.18)}.row.me .stack i[style*="var(--ink)"]{background:#9aa3b3!important}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 16px;font:600 12px var(--f-label);letter-spacing:.06em}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* modal + aviso */
.modal{position:fixed;inset:0;z-index:100;background:rgba(11,12,16,.55);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.sheet{background:#fff;border-radius:24px;width:min(860px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sheet h2{font:400 26px var(--f-display);text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.tbl td:last-child{text-align:right;font-family:var(--f-label);font-weight:700}
.tbl tr.h td{font:700 11px var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding-top:18px}
.tbl tr.t td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.eq{padding:12px 14px;border-radius:12px;background:#e8f7ee;color:var(--good);font:700 13px var(--f-label);letter-spacing:.06em;margin-top:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;font:700 13px var(--f-label);letter-spacing:.06em;z-index:200;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr;grid-template-rows:auto}
  .hero .head,.hero .cars,.hero .cta,.hero .side{grid-column:1;grid-row:auto}
  .hero .side{padding-top:8px}
  .gar,.finhero .stage,.dec,.g21{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
  .sticky{position:static}
}
@media (max-width:700px){
  .top{padding:0 14px;gap:10px;height:auto;flex-wrap:wrap}
  .logo small,.who{display:none}
  nav{order:3;width:100%;margin:0}
  nav a{padding:12px 12px}
  .status{margin-left:auto}
  .hero,.gar,.page,.pagehead .stage,.finhero .stage{padding-left:16px;padding-right:16px}

function chart(f){
  const w=640,h=250,pl=54,pr=24,pt=24,pb=36;
  const pts=[...HIST, f.caja/1e6];
  const mn=Math.floor(Math.min(...pts)-0.5), mx=Math.ceil(Math.max(...pts)+0.5);
  const X=i=>pl+i*(w-pl-pr)/(pts.length-1), Y=v=>pt+(mx-v)*(h-pt-pb)/(mx-mn);
  const real=HIST.map((v,i)=>`${i?"L":"M"}${X(i)} ${Y(v)}`).join(" ");
  const area=real+` L${X(HIST.length-1)} ${h-pb} L${X(0)} ${h-pb}Z`;
  let grid=""; for(let v=mn;v<=mx;v+=1){grid+=`<path d="M${pl} ${Y(v)}H${w-pr}" stroke="#e8ebf0"/><text x="${pl-10}" y="${Y(v)+4}" text-anchor="end" font-size="12" font-family="Chakra Petch" fill="#5b6270">${v} M</text>`}
  const lab=["Inicio","R1","R2","R3","R4","R5 prev."].map((t,i)=>`<text x="${X(i)}" y="${h-10}" text-anchor="middle" font-size="12" font-family="Chakra Petch" fill="#5b6270">${t}</text>`).join("");
  const lx=X(HIST.length-1), ly=Y(HIST[HIST.length-1]), px=X(pts.length-1), py=Y(f.caja/1e6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolución de la tesorería en millones de euros"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5cff" stop-opacity=".28"/><stop offset="1" stop-color="#0a5cff" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ar)"/><path d="${real}" fill="none" stroke="#0a5cff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M${lx} ${ly}L${px} ${py}" stroke="#0a5cff" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
    ${HIST.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===HIST.length-1?7:4}" fill="#fff" stroke="#0a5cff" stroke-width="3"/>`).join("")}
    <circle cx="${px}" cy="${py}" r="8" fill="#0a5cff"/><text x="${px}" y="${py-14}" text-anchor="end" font-size="13" font-weight="700" font-family="Chakra Petch" fill="#0b0c10">${M(f.caja)}</text>${lab}</svg>`;
}

const TRACK="M120 330 C60 330 40 270 70 220 C100 170 170 190 200 150 C230 105 300 60 380 70 C450 78 470 130 540 120 C620 108 700 60 740 120 C775 172 720 215 660 235 C600 255 600 300 650 330 C700 362 640 400 540 395 C440 390 400 350 330 360 C260 370 190 380 120 330Z";

const hm=m=>`${Math.floor(m/60)}:${String(Math.floor(m%60)).padStart(2,"0")}`;

const order=()=>S.race.dist.map((d,i)=>i).sort((a,b)=>S.race.dist[b]-S.race.dist[a]);

function incidentCard(R){
  const ins=S.dec.ins;
  return `<div class="card solid inc" style="margin-top:18px"><div class="ct"><div><span class="tag bad">Incidencia</span><h3 class="disp" style="font-size:22px;margin-top:10px">Frenos con temperatura alta</h3></div><div class="cd"><b class="num" id="cd">20</b><small>segundos</small></div></div>
  <p style="margin-bottom:12px">Con el calor se recalientan. Elige cómo responder: cada opción tiene un coste. Si no decides, sigues como estás.</p>
  <div style="display:grid;gap:10px"><button class="opt" data-race="inc" data-k="box"><b>Entrar a boxes a refrigerar<span class="cost" style="color:var(--loss)">−18.000 €</span></b><small>Pierdes una posición, pero los frenos quedan seguros.</small></button>
  <button class="opt" data-race="inc" data-k="slow"><b>Reducir el ritmo<span class="cost">Sin coste</span></b><small>Pierdes algo de tiempo en pista.</small></button>
  <button class="opt" data-race="inc" data-k="keep"><b>Seguir como estás<span class="cost" style="color:var(--loss)">Riesgo de avería</span></b><small>Sin coste directo. ${ins?"Tu seguro cubre el 80% si falla.":"No tienes seguro anti-averías."}</small></button></div></div>`;
}
function resultCard(r){
  return `<div class="card solid" style="margin-top:18px;border-top:6px solid var(--gold)"><span class="tag warn">Tramo terminado</span><h3 class="disp" style="font-size:30px;margin:10px 0">Has terminado P${r.pos}</h3>
  <div class="grid g3"><div class="kpi"><span class="lbl">Puntos</span><div class="v">${r.pts}</div></div><div class="kpi"><span class="lbl">Premio</span><div class="v" style="font-size:26px;color:var(--good)">${eurSigned(r.premio)}</div></div><div class="kpi"><span class="lbl">Costes de carrera</span><div class="v" style="font-size:26px;color:var(--loss)">${r.cost?"−"+eur(r.cost):"0 €"}</div></div></div>
  <p style="margin-top:12px;color:var(--ink2)">Este dinero entra en tus cuentas cuando el profesorado cierre la ronda.</p></div>`;
}
function meLap(lap){
  const R=S.race, q=1-(avgOvr()-68)*.0012;
  return lap*q*RISKS[R.risk][2]*(R.pen||1);
}
function raceStep(dt){
  const R=S.race; if(!R.run||R.inc||R.done) return;
  const sim=Math.min(dt,.1)*R.speed*3;
  R.t=Math.min(360,R.t+sim);
  CARS.forEach((c,i)=>{let lap=c.lap*(1+.008*Math.sin(R.t/29+c.ph)); if(c.me) lap=meLap(lap); R.dist[i]+=sim/lap});
  if(!R.incDone&&R.t>=140){R.incDone=true;R.run=false;R.inc={t0:performance.now()};R.log.push(`${hm(R.t)} · Aviso del muro: frenos con temperatura alta.`);render();return}
  if(R.t>=360) finishRace();
}
function finishRace(){
  const R=S.race; R.done=true;R.run=false;
  const ord=order(), pos=ord.indexOf(3)+1;
  S.raceResult={pos,pts:PTS[pos-1],premio:PRIZE[pos-1],cost:R.cost};
  R.log.push(`${hm(360)} · Bandera a cuadros. Terminas P${pos}.`); render();
}
function resolveInc(k){
  const R=S.race; if(!R.inc) return; R.inc=null; let m="";
  if(k==="box"){R.cost+=18000;R.dist[3]-=.12;m="Entras a boxes, enfrías los frenos y sales una posición más atrás. Coste: 18.000 €."}
  else if(k==="slow"){R.dist[3]-=.05;m="Reduces el ritmo unos minutos. Pierdes algo de tiempo, pero llegas entero."}
  else{
    const p={cons:.25,eq:.45,agr:.7}[R.risk]+(48<50?.1:0);
    if(Math.random()<p){const rep=75000, pay=S.dec.ins?rep*.2:rep;R.cost+=pay;R.dist[3]-=.4;m=`Los frenos fallan. Pierdes vueltas en boxes. Reparación: ${eur(pay)}${S.dec.ins?" (tu seguro cubre el 80%)":""}.`}
    else m="Has tenido suerte: los frenos aguantan. La próxima vez puede no ser así.";
  }
  R.log.push(`${hm(R.t)} · ${m}`); R.run=true; toast(m); render();
}
function initTrack(){
  const p=$("#trk"); if(!p) return; trackL=p.getTotalLength();
  const a=p.getPointAtLength(0), b=p.getPointAtLength(3);
  $("#sf").setAttribute("transform",`translate(${a.x} ${a.y}) rotate(${Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI})`);
}
function paintRace(){
  const R=S.race; if(!R||!trackL||!$("#trk")) return;
  const ord=order();
  document.querySelectorAll(".mk").forEach(g=>{const i=+g.dataset.i,f=((R.dist[i]%1)+1)%1,pt=$("#trk").getPointAtLength(f*trackL);g.setAttribute("transform",`translate(${pt.x} ${pt.y})`)});
  const lead=R.dist[ord[0]];
  document.querySelectorAll(".trow").forEach(r=>{const i=+r.dataset.i,pos=ord.indexOf(i);r.style.order=pos;r.querySelector(".tp").textContent=pos+1;
    const gap=(lead-R.dist[i]);r.querySelector("em").textContent=pos===0?"Líder":gap>=1?`+${Math.floor(gap)} vuelta${Math.floor(gap)>1?"s":""}`:`+${(gap*CARS[i].lap*60).toFixed(1).replace(".",",")} s`});
  const pos=ord.indexOf(3)+1;
  $("#rt").textContent=`${hm(R.t)} de 6:00`;$("#rbar").style.width=R.t/360*100+"%";$("#rpos").textContent="P"+pos;$("#rlap").textContent=Math.max(0,Math.floor(R.dist[3]));
  $("#rrel").innerHTML=Math.round(Math.max(20,92-(R.t/360)*(R.risk==="agr"?28:R.risk==="cons"?14:20)))+"<small> %</small>";
  $("#rtyre").textContent=R.t<120?"Nuevo":R.t<240?"Medio":"Gastado";
  if(R.inc){const left=Math.max(0,20-(performance.now()-R.inc.t0)/1000);const c=$("#cd");if(c)c.textContent=Math.ceil(left);if(left<=0)resolveInc("keep")}
}
function startRace(){
  const g=++gen; let last=0; initTrack(); paintRace();
  const loop=ts=>{ if(g!==gen||render.k!=="carrera") return;
    const dt=last?(ts-last)/1000:0; last=ts; raceStep(dt); if(g!==gen) return; paintRace(); requestAnimationFrame(loop) };
  requestAnimationFrame(loop);
}

    <div class="sec"><h2>Tus 6 departamentos</h2><div class="grid g3">${dept.map((d,i)=>`<div class="card solid"><span class="lbl">Departamento ${i+1}</span><h3 class="disp" style="font-size:18px;margin:8px 0">${d[0]}</h3><p style="color:var(--ink2)">${d[1]}</p></div>`).join("")}</div></div>
    <div class="sec"><h2>Los 4 índices de gestión</h2><div class="grid g4">${[["Tecnológico","Tus mejoras de I+D y tu equipamiento."],["Capital humano","Calidad y moral de tu plantilla."],["Calidad operativa","Recambios, mantenimiento y horas de preparación."],["Financiero","Liquidez, deuda y rating de solvencia."]].map(k=>`<div class="kpi"><span class="lbl">${k[0]}</span><p style="margin-top:10px;font-weight:600">${k[1]}</p></div>`).join("")}</div></div>
    <div class="sec"><h2>Cómo es una ronda</h2><div class="grid g4">${cyc.map((c,i)=>`<div class="card solid" style="border-top:6px solid ${["var(--good)","var(--gold)","var(--blue)","var(--ink)"][i]}"><span class="lbl">Estado ${i+1}</span><h3 class="disp" style="font-size:20px;margin:8px 0">${c[0]}</h3><p style="color:var(--ink2)">${c[1]}</p></div>`).join("")}</div></div>
    <div class="sec"><h2>La temporada: 18 rondas</h2>
      <div class="cal">${[...Array(18)].map((_,i)=>{const n=i+1;return `<div class="cd2 ${n===5?"now":""} ${n===9?"jun":""} ${n===18?"fin":""}"><b>${n}</b><small>${n===5?"Estás aquí":n===9?"Junta":n===18?"24 H":""}</small></div>`}).join("")}</div>
      <p style="margin-top:12px;color:var(--ink2)">En la ronda 9 se celebra la Junta de Accionistas y Patrocinadores para revisar tu plan estratégico. La ronda 18 es la Gran Final de 24 horas.</p></div>
    <div class="sec"><h2>Las respuestas llegan tarde</h2><div class="grid g2"><div class="card solid"><span class="tag blue">t + 1</span><h3 class="disp" style="font-size:20px;margin:10px 0 6px">Una ronda después</h3><p style="color:var(--ink2)">Negociaciones con patrocinadores y fichajes de personal.</p></div><div class="card solid"><span class="tag blue">t + 2</span><h3 class="disp" style="font-size:20px;margin:10px 0 6px">Dos rondas o más</h3><p style="color:var(--ink2)">Proyectos de I+D en el laboratorio. Planifica con tiempo.</p></div></div></div>
    <div class="sec"><h2>Consejos para ganar</h2><div class="grid g3">${[["Defiende tu estrategia","Elige una estrategia y que tus decisiones la sigan. Es el 40% de la nota."],["Cuida la caja","Un préstamo da aire hoy pero baja tu rating. Mira siempre la previsión antes de confirmar."],["Mira el desgaste","Con calor, un motor muy gastado falla. Dedica horas a mantenimiento."]].map(t=>`<div class="card solid" style="border-left:6px solid var(--red)"><h3 class="disp" style="font-size:18px;margin-bottom:8px">${t[0]}</h3><p style="color:var(--ink2)">${t[1]}</p></div>`).join("")}</div></div>
    <div class="sec"><h2>Preguntas frecuentes</h2>${faq.map(f=>`<details class="faq"><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</div>
  </div>`;
}


const STRAT=[["costes","Liderazgo en costes","Competir con precios y gastos bajos."],["dif","Diferenciación","Destacar por calidad, fiabilidad y tecnología."],["enfoque","Enfoque","Especializarte en un tipo de patrocinador o carrera."],["diversif","Diversificación","Repartir riesgos entre varias fuentes de ingresos."],["alianzas","Alianzas","Crecer apoyándote en socios y proveedores."]];
const OBJ=[["rent","Rentabilidad","Beneficio positivo en cada ronda."],["crec","Crecimiento","Ingresos mayores que en la ronda anterior."],["solv","Solvencia","Mantener rating A o mejor."],["podio","Podio","Terminar entre los 3 primeros."]];
function vEstrategia(){
  const st=STRAT.find(x=>x[0]===S.strat);
  return `<section class="scene pagehead">${backdrop("head")}
    <div class="stage"><span class="eyebrow"><em>Estrategia</em> · Dirección de la escudería</span><h1 class="disp">Qué escudería quieres ser</h1><p>Elige tu estrategia y fija objetivos. Cada ronda se comprueba si tus decisiones encajan con lo que has declarado. Vale el 40% de la nota.</p></div></section>
  <div class="page">
    <div class="card solid" style="margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-left:6px solid ${st?"var(--good)":"var(--gold)"}"><span class="tag ${st?"good":"warn"}">${st?"Declarada":"Pendiente"}</span><span style="font-weight:600">${st?"Tu estrategia: "+st[1]+" · "+S.obj.length+" objetivo"+(S.obj.length===1?"":"s")+".":"Todavía no has declarado estrategia. Sin ella, tu coherencia estratégica baja."}</span></div>
    <div class="sec"><h2>Tu estrategia</h2><div class="grid g3">${STRAT.map(x=>`<button class="opt" data-strat="${x[0]}" aria-pressed="${S.strat===x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join("")}</div></div>
    <div class="sec"><h2>Objetivos medibles</h2><p style="color:var(--ink2);margin:-6px 0 14px">Elige los que te comprometes a cumplir.</p><div class="grid g4">${OBJ.map(x=>`<button class="opt" data-obj="${x[0]}" aria-pressed="${S.obj.includes(x[0])}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join("")}</div></div>
  </div>`;
}

function openCloseRound(){
  const pend=[];if(!S.strat)pend.push("No has declarado estrategia.");if(!S.obj.length)pend.push("No has fijado objetivos.");if(!hasPilot())pend.push("No tienes piloto.");
  $("#modal").innerHTML=`<div class="sheet" style="max-width:520px"><h2>¿Cerrar la ronda 5?</h2><p style="margin:12px 0;color:var(--ink2)">Es definitivo: tus decisiones quedarán bloqueadas y no podrás cambiarlas.</p>${pend.length?`<div class="eq" style="background:#fff4d6;color:#8a6500">${pend.join("<br>")}</div>`:""}<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px"><button class="btn ghost sm" data-close>Cancelar</button><button class="btn sm" data-close-ok>Cerrar ronda</button></div></div>`;
  $("#modal").hidden=false;
}
/* ============ router y eventos ============ */
const ROUTES={inicio:["Inicio",vInicio],estrategia:["Estrategia",vEstrategia],garaje:["Garaje",vGaraje],equipo:["Equipo",vEquipo],finanzas:["Finanzas",vFinanzas],carrera:["Carrera",vCarrera],clasificacion:["Clasificación",vClasif],normas:["Normas",vNormas]};
const ALIAS={mercado:["equipo","mercado"],patrocinio:["finanzas","patrocinio"]};
let cur=null;
function render(){
  let want=(cur||location.hash||"#inicio").replace("#","");
  if(ALIAS[want]) want=ALIAS[want][0];
  const k=ROUTES[want]?want:"inicio";
  $("#nav").innerHTML=Object.entries(ROUTES).map(([id,[n]])=>`<a href="#${id}" ${id===k?'aria-current="page"':""}>${n}</a>`).join("");
  const y=scrollY; $("#app").innerHTML=ROUTES[k][1](); document.documentElement.style.setProperty("--livery",S.livery);
  if(render.k===k) scrollTo(0,y); else scrollTo(0,0); render.k=k;
  $("#pill").innerHTML='<i></i>Ronda 5 / 18 · '+({abierta:"Abierta",cerrada:"Cerrada"}[S.engine]);
  const cb=$("#closeBtn"); cb.textContent=S.engine==="abierta"?"Cerrar ronda":"Reabrir (demo)"; cb.classList.toggle("ghost",S.engine!=="abierta");
  if(k==="carrera") startRace();
}
function goAnchor(){const al=ALIAS[(cur||location.hash||"").replace("#","")];if(al){const el=document.getElementById(al[1]);if(el)el.scrollIntoView({block:"start"})}}
addEventListener("hashchange",()=>{cur=null;render();goAnchor()});
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a||e.defaultPrevented) return;
  e.preventDefault(); const h=a.getAttribute("href"); cur=h.slice(1);
  try{history.replaceState(null,"",h)}catch(_){}
  render();
  goAnchor();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const D=t.dataset;
  const LOCK=["fire","fireOk","neg","offerSend","withdraw","spon","spUndo","loan","ins","sup","sim","tun","save","strat","obj"];
  if(S.engine==="cerrada"&&LOCK.some(k=>D[k]!==undefined)){$("#modal").hidden=true;toast("Ronda cerrada: tus decisiones están bloqueadas.");return}
  if(D.closeRound!==undefined){if(S.engine==="abierta")openCloseRound();else{S.engine="abierta";toast("Ronda reabierta.");render()}return}
  if(D.closeOk!==undefined){S.engine="cerrada";$("#modal").hidden=true;toast("Ronda cerrada. Tus decisiones están guardadas y bloqueadas.");render();return}
  if(D.strat){S.strat=D.strat;toast("Estrategia declarada.");render();return}
  if(D.obj){S.obj=S.obj.includes(D.obj)?S.obj.filter(x=>x!==D.obj):[...S.obj,D.obj];render();return}
  if(D.fire){openFire(D.fire)}
  else if(D.fireOk){doFire(D.fireOk)}
  else if(D.neg){openNeg(D.neg)}
  else if(D.offerSend){sendOffer(D.offerSend)}
  else if(D.withdraw!==undefined){S.offers.splice(+D.withdraw,1);toast("Oferta retirada.");render()}
  else if(D.mkt){S.mkt=D.mkt;render()}
  else if(D.spon){const n=SP.filter(x=>["firmado","pendiente"].includes(S.sp[x.id])).length;if(n>=4)toast("Ya tienes 4 patrocinadores activos o pendientes.");else{S.sp[D.spon]="pendiente";toast("Propuesta enviada. Respuesta en la próxima ronda.");render()}}
  else if(D.spUndo){S.sp[D.spUndo]="libre";render()}
  else if(D.race){const R=S.race||(S.race=newRace());
    if(D.race==="toggle"){R.run=!R.run;render()}
    else if(D.race==="speed"){R.speed=+D.v;render()}
    else if(D.race==="reset"){S.race=newRace();S.raceResult=null;render()}
    else if(D.race==="risk"){R.risk=D.k;render()}
    else if(D.race==="inc"){resolveInc(D.k)}}
  else if(D.part){S.part=D.part;render()}
  else if(D.color){S.livery=D.color;render()}
  else if(D.sim!==undefined){S.sim=+D.sim;render()}
  else if(D.tun!==undefined){S.tunel=+D.tun;render()}
  else if(D.save==="rd"){toast("I+D guardado. Los proyectos usarán el nuevo equipamiento.")}
  else if(D.save==="dec"){toast("Decisiones guardadas. Puedes cambiarlas hasta cerrar la ronda.")}
  else if(D.fich){toast("Oferta enviada a "+D.fich+". Respuesta en la próxima ronda.")}
  else if(D.loan!==undefined){S.dec.loan=!S.dec.loan;render()}
  else if(D.ins!==undefined){S.dec.ins=!S.dec.ins;render()}
  else if(D.sup){S.dec.sup=D.sup;render()}
  else if(D.rank){rankMode=D.rank;render()}
  else if(D.books!==undefined){openBooks()}
  else if(D.tab){openBooks(D.tab)}
  else if(D.close!==undefined){$("#modal").hidden=true}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").hidden=true});
addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").hidden=true});
document.addEventListener("input",e=>{
  const dd=e.target.dataset;
  if(S.engine==="cerrada"&&(dd.h||dd.mk!==undefined||dd.offer)){toast("Ronda cerrada: tus decisiones están bloqueadas.");render();return}
  if(dd.offer){const c=CAND.find(x=>x.id===dd.offer),p=+e.target.value,ch=chanceOf(c,p);$("#offerpct").textContent=p+"%";$("#offerpay").textContent=eur(Math.round(c.pay*p/100));$("#offerch").textContent=ch+"%";$("#offerbar").style.width=ch+"%";return}
  if(dd.mk!==undefined){S.mk=+e.target.value;$("#mkv").textContent=eur(S.mk);$("#mer").textContent=eur(Math.round(290000+S.mk*.6));return}
  const k=dd.h; if(!k) return;
  const v=+e.target.value, others=Object.keys(S.hours).filter(x=>x!==k), rest=400-v, cur=others.reduce((s,o)=>s+S.hours[o],0);
  S.hours[k]=v; let used=0;
  others.forEach((o,i)=>{const val=i===others.length-1?rest-used:Math.round((cur?S.hours[o]/cur:.5)*rest/10)*10;S.hours[o]=val;used+=val});
  paintHours();
});
function paintHours(){
  const h=S.hours, cols={prep:"#0a5cff",rd:"#e10600",mant:"#0f9d58"}, R=62, C=2*Math.PI*R; let off=0;
  Object.keys(h).forEach(k=>{
    const inp=document.querySelector(`[data-h="${k}"]`); if(inp&&+inp.value!==h[k]) inp.value=h[k];
    const lab=document.querySelector(`[data-hv="${k}"]`); if(lab) lab.textContent=h[k]+" h";
    const arc=document.querySelector(`[data-arc="${k}"]`);
    if(arc){const len=h[k]/400*C;arc.setAttribute("stroke-dasharray",`${len} ${C-len}`);arc.setAttribute("stroke-dashoffset",-off);off+=len}
  });
}
render();goAnchor();
</script>
</body>
</html>
