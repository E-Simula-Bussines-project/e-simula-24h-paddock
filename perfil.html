<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#2b3a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="theme.css">
<style>
/* Tokens, cabecera, menú, hero y escena vienen de theme.css */
h2{font-size:1.15rem;margin:0 0 12px;font-weight:600}
.vista{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.vista button{border:0;background:none;color:var(--muted);padding:9px 14px;font:inherit;cursor:pointer}
.vista button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.1fr 1fr}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;flex:none}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;display:block;object-fit:cover}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.prof h2{margin:0;font-size:1.4rem}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:600;margin-right:6px}
.b-DAM{background:var(--dam-bg);color:var(--dam)}.b-DAW{background:var(--daw-bg);color:var(--daw)}.b-ASIX{background:var(--asix-bg);color:var(--asix)}
.b-c{background:var(--line);color:var(--ink)}.b-warn{background:var(--warn-bg);color:var(--warn)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.members{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.members li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.members .avatar{width:36px;height:36px;font-size:.9rem}
.members small{color:var(--muted);display:block;line-height:1.2}
.me{border-color:var(--brand)!important}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--brand)}
.btn.danger{background:none;border-color:var(--warn);color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn{min-height:44px}.btn.sm{min-height:38px}select,input:not([type=checkbox]){min-height:42px}
.intro{color:var(--muted);margin:0 0 14px;max-width:70ch}
.hint{color:var(--muted);font-size:.85rem;font-weight:400}
.alert{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--daw-bg);border:1px solid var(--daw);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tools .grow{flex:1;min-width:160px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.9rem}
td.act{white-space:nowrap;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat b{display:block;font-size:1.6rem;line-height:1.1}.stat span{color:var(--muted);font-size:.9rem}
.tabs{margin-bottom:16px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empty{color:var(--muted);padding:12px 0}
.pgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;margin-bottom:16px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.adm{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.adm button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;display:grid;gap:2px}
.adm button:hover{border-color:var(--brand)}
.adm small{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,14,30,.55)}
dialog form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
label input,label select{color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em;margin:0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1;pointer-events:auto}#toast button{margin-left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar-r{display:flex;gap:10px;align-items:center;justify-content:flex-end;min-width:0}
.usr[aria-current="page"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--info-bg)}
@media (max-width:640px){.brand span{display:none}.bar-r{gap:8px}.vista button{padding:8px 9px;font-size:.9rem}.usr{padding:3px}.usr span{display:none}}
.card{padding:20px}
.card .prof h2{margin:0;font-size:1.4rem;color:var(--ink);letter-spacing:0;text-transform:none;font-weight:600}
.intro{margin-top:0}
</style>
</head>

    }
    function aTut() {
        var h = TUT.map(function (t) { var n = groups.filter(function (g) { return g.t === t.id; }).length; return `<tr><td style="display:flex;gap:10px;align-items:center"><span class="avatar" style="width:36px;height:36px">${face(100 + t.id, t.n)}</span><span><b>${esc(t.n)}</b><br><small style="color:var(--muted)">${esc(t.e)}</small></span></td><td>${esc(t.c)}</td><td>${n} equipos</td><td class="act"><button class="btn ghost sm" data-ad="editT" data-id="${t.id}">Editar</button> <button class="btn danger sm" data-ad="delT" data-id="${t.id}">Dar de baja</button></td></tr>`; }).join('');
        return `<section class="card"><div class="tools"><h2 class="grow" style="margin:0">Tutores</h2><button class="btn" data-ad="newT">Dar de alta tutor</button></div>` + (TUT.length ? `<div class="tablewrap"><table><thead><tr><th>Tutor</th><th>Ciclos</th><th>Equipos</th><th></th></tr></thead><tbody>${h}</tbody></table></div>` : '<p class="empty">No hay tutores.</p>') + `</section>`;
    }
    function aEq() {
        var c = groups.map(function (g) { var m = members(g.id); return `<article class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h2 style="margin:0">${esc(g.n)}</h2><span class="badge b-c">${m.length}/${MAX} pilotos</span></div><dl style="margin-top:12px"><dt>Coche</dt><dd>${esc(g.coche || 'Sin asignar')}</dd><dt>Tutor</dt><dd>${esc(tn(g.t))}</dd></dl><p style="color:var(--muted);margin:8px 0 0;font-size:.9rem">${m.map(function (s) { return esc(s.nombre); }).join(', ') || 'Sin pilotos'}</p><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn ghost sm" data-ad="editE" data-id="${g.id}">Editar</button><button class="btn danger sm" data-ad="delE" data-id="${g.id}">Eliminar</button></div></article>`; }).join('');
        return `<div class="tools"><h2 class="grow" style="margin:0">Equipos</h2><button class="btn" data-ad="newE">Dar de alta equipo</button></div>` + (groups.length ? `<div class="groups">${c}</div>` : '<p class="empty">No hay equipos.</p>');
    }
    function pForm(p0) {
        var n = !p0;
        var p = p0 || { id: 0, rondas: [], nombre: '', nr: 5, inicio: new Date().toISOString().slice(0, 10), cada: 7, vueltas: 10, cat: 'Gr.3', meteo: 'Seco', desg: 'Normal', safety: true, estado: 'Borrador' };
        var nr = p.rondas.length || p.nr;
        open(`<h2>${n ? 'Crear partida' : 'Editar partida'}</h2><label>Nombre<input name="nombre" required value="${esc(p.nombre)}"></label><label>Número de rondas<input name="nr" type="number" min="1" max="20" required value="${nr}"><small class="hint">Cuántas carreras forman la partida (de 1 a 20).</small></label><label>Fecha de la primera ronda<input name="inicio" type="date" required value="${p.inicio}"></label><label>Días entre rondas<input name="cada" type="number" min="1" max="90" required value="${p.cada}"><small class="hint">Por ejemplo, 7 significa una ronda cada semana.</small></label><label>Vueltas por ronda<input name="vueltas" type="number" min="1" max="99" required value="${p.vueltas}"><small class="hint">Cuántas vueltas al circuito dura cada carrera.</small></label><label>Categoría<select name="cat">${opt(CATS, p.cat)}</select><small class="hint">Tipo de coches. Gr.3 y Gr.4 son coches de circuito; Gr.B, de rally.</small></label><label>Meteorología<select name="meteo">${opt(METEO, p.meteo)}</select><small class="hint">Si hace sol, llueve o cambia durante la carrera.</small></label><label>Desgaste de neumáticos<select name="desg">${opt(DESG, p.desg)}</select><small class="hint">Los neumáticos se gastan y hay que cuidarlos. Desactivado lo hace más fácil.</small></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="safety"${p.safety ? ' checked' : ''}><span>Safety car activado<small class="hint" style="display:block">Un coche de seguridad frena la carrera si hay un accidente.</small></span></label><label>Estado<select name="estado">${opt(['Borrador', 'Abierta', 'Finalizada'], p.estado)}</select><small class="hint">Borrador: aún se está preparando. Abierta: en marcha. Finalizada: terminada.</small></label>` + actions(n ? 'Crear partida' : 'Guardar cambios'), function (f) {
            var d = { nombre: fv(f, 'nombre').trim(), nr: Number(fv(f, 'nr')), inicio: fv(f, 'inicio'), cada: Number(fv(f, 'cada')), vueltas: Number(fv(f, 'vueltas')), cat: fv(f, 'cat'), meteo: fv(f, 'meteo'), desg: fv(f, 'desg'), safety: !!fv(f, 'safety'), estado: fv(f, 'estado') };
            if (d.nr < 1 || d.nr > 20)
                return err('Las rondas deben ser entre 1 y 20.');
            if (n) {
                mkPart(d);
                toast('Partida creada');
            }
            else {
                var ch = d.nr !== p.rondas.length || d.inicio !== p.inicio || d.cada !== p.cada;
                Object.assign(p, d);
                if (ch)
                    p.rondas = gen(d, p.rondas);
                toast('Cambios guardados');
            }
        });
    }
    function tForm(t0) {
        var n = !t0;
        var t = t0 || { id: 0, n: '', e: '', c: '' };
        open(`<h2>${n ? 'Dar de alta tutor' : 'Editar tutor'}</h2><label>Nombre completo<input name="n" required value="${esc(t.n)}"></label><label>Correo<input name="e" type="email" required value="${esc(t.e)}"></label><label>Ciclos que tutoriza<input name="c" placeholder="DAM, DAW" value="${esc(t.c)}"></label>` + actions(n ? 'Dar de alta' : 'Guardar cambios'), function (f) {
            var d = { n: fv(f, 'n').trim(), e: fv(f, 'e').trim(), c: fv(f, 'c').trim() };
            if (n) {
                TUT.push({ ...d, id: nextT++ });
                toast('Tutor dado de alta');
            }
            else {
                Object.assign(t, d);
                toast('Cambios guardados');
            }
        });
    }
    function eForm(g0) {
        var n = !g0;
        var g = g0 || { id: 0, n: 'Equipo ' + (groups.length + 1), coche: COCHES[0], t: TUT.length ? TUT[0].id : null };
        open(`<h2>${n ? 'Dar de alta equipo' : 'Editar equipo'}</h2><label>Nombre del equipo<input name="n" required value="${esc(g.n)}"></label><label>Coche<select name="coche">${opt(COCHES, g.coche)}</select></label><label>Tutor<select name="t"><option value="">Sin tutor</option>${TUT.map(function (t) { return `<option value="${t.id}"${t.id === g.t ? ' selected' : ''}>${esc(t.n)}</option>`; }).join('')}</select></label><p style="margin:0;color:var(--muted);font-size:.9rem">Los pilotos del equipo (2 o 3 alumnos) los asigna el profesor.</p>` + actions(n ? 'Dar de alta' : 'Guardar cambios'), function (f) {
            var d = { n: fv(f, 'n').trim(), coche: fv(f, 'coche'), t: fv(f, 't') ? Number(fv(f, 't')) : null };
            if (n) {
                groups.push({ ...d, id: nextG++ });
                toast('Equipo dado de alta');
            }
            else {
                Object.assign(g, d);
                toast('Cambios guardados');
            }
        });
    }
    document.addEventListener('click', function (e) {
        var t = e.target.closest('button');
        if (!t)
            return;
        if (t.id === 'vAdm') {
            role = 'admin';
            render();
            return;
        }
        if (t.dataset.atab) {
            aTab = t.dataset.atab;
            render();
            return;
        }
        var a = t.dataset.ad, id = Number(t.dataset.id);
        if (!a)
            return;
        if (a === 'newP')
            pForm();
        else if (a === 'editP')
            pForm(pById(id));
        else if (a === 'delP') {
            var p = pById(id);
            confirmBox('Eliminar partida', '¿Eliminar <b>' + esc(p.nombre) + '</b> y sus ' + p.rondas.length + ' rondas?', 'Eliminar partida', function () { PART = PART.filter(function (x) { return x.id !== id; }); });
        }
        else if (a === 'newT')
            tForm();
        else if (a === 'editT')
            tForm(tById(id));
        else if (a === 'delT') {
            var u = tById(id);
            confirmBox('Dar de baja tutor', '¿Dar de baja a <b>' + esc(u.n) + '</b>? Sus equipos quedarán sin tutor.', 'Dar de baja', function () { groups.forEach(function (g) { if (g.t === id)
                g.t = null; }); TUT = TUT.filter(function (x) { return x.id !== id; }); });
        }
        else if (a === 'newE')
            eForm();
        else if (a === 'editE')
            eForm(gById(id));
        else if (a === 'delE') {
            var g = gById(id);
            confirmBox('Eliminar equipo', '¿Eliminar <b>' + esc(g.n) + '</b>? Sus pilotos quedarán sin equipo.', 'Eliminar equipo', function () { students.forEach(function (s) { if (s.grupo === id)
                s.grupo = null; }); groups = groups.filter(function (x) { return x.id !== id; }); });
        }
    });
    document.addEventListener('change', function (e) {
        var t = e.target;
        if (!t.dataset.cal)
            return;
        var p = pById(Number(t.dataset.p)), r = p.rondas.filter(function (x) { return x.n === Number(t.dataset.r); })[0];
        if (t.dataset.cal === 'f') {
            if (!t.value)
                return;
            r.f = t.value;
        }
        else
            r.pista = t.value;
        render();
        toast('Calendario actualizado');
    });
    document.addEventListener('change', function (e) {
        var t = e.target;
        if (!t.dataset.asg)
            return;
        snap();
        sById(Number(t.dataset.asg)).grupo = t.value ? Number(t.value) : null;
        render();
        toast('Grupo actualizado', true);
    });
    function render() { head(); role === 'alumno' ? viewAlumno() : role === 'admin' ? viewAdmin() : viewProfe(); }
    render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
