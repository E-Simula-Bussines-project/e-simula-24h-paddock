<style>
.rr-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}.rr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.rr-stats small{color:var(--muted);font-size:12px}.rr-stats b{display:block;font-size:25px;letter-spacing:-.5px}.rr-stats .card{min-width:0}.rr-group{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}.rr-group-head{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;background:#f1f3f6;font-size:14px}.rr-group-head small{display:block;color:var(--muted);font-weight:400}.rr-person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;border-top:1px solid var(--line);flex-wrap:wrap}.rr-person small{display:block;color:var(--muted);font-size:12px}.rr-person .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rr-person button,.rr-person input{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 9px;font-size:12px}.rr-person .primary{background:var(--brand);color:white;border-color:var(--brand);font-weight:650}.rr-person .danger{color:#a20c22}.rr-person input{width:104px}.rr-pending{display:block;color:#aa650b;font-size:12px}.rr-alert{background:#fff1ce;color:#855209;border-radius:9px;padding:12px;margin-top:12px;font-size:13px}.rr-right{display:grid;gap:14px}.rr-right .rr-person{padding:11px 0}.rr-right .rr-person:first-of-type{border-top:0}.rr-resp{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.rr-resp span{color:var(--muted)}.rr-note{font-size:12px;color:var(--muted)}.demo{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;margin-top:22px}.demo select{border:1px solid var(--line);border-radius:8px;padding:8px;background:white;color:var(--ink)}.round-label{display:inline-block;padding:5px 10px;background:#e6eaf0;color:#344154;font-size:12px;border-radius:20px;font-weight:650}#notice{font-size:13px;color:var(--brand);margin:8px 0}@media(max-width:1000px){.rr-layout{grid-template-columns:1fr}}@media(max-width:650px){.rr-stats{grid-template-columns:1fr 1fr}.rr-stats .card:last-child{grid-column:1/-1}.rr-person .actions{width:100%}}

.rr-person{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px}.rr-face{width:64px;height:64px;object-fit:cover;border-radius:50%;background:#eef0f4}.rr-person-info{min-width:0}.rr-right .rr-person{grid-template-columns:64px minmax(0,1fr)}.rr-right .rr-person .actions{grid-column:2/-1}@media(max-width:1250px){.rr-person{grid-template-columns:64px minmax(0,1fr)}.rr-person .actions{grid-column:2/-1;justify-content:flex-start;width:auto}}@media(max-width:450px){.rr-person .actions,.rr-right .rr-person .actions{grid-column:1/-1}}
</style>

 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg><span>Situación financiera</span></a><a href="recursos-humanos.html" aria-current="page" title="Recursos humanos" aria-label="Recursos humanos"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3zM16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 4 5v2"/></svg><span>Recursos humanos</span></a><a href="perfil.html" title="Perfil" aria-label="Perfil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></svg><span>Perfil</span></a><div class="sidebar-bottom"><span>TEMPORADA DE RESISTENCIA</span><b>18 rondas · 6 carreras</b></div></nav><button type="button" class="menu-backdrop" id="menu-backdrop" aria-label="Cerrar menú" tabindex="-1"></button><h1 class="page-title">Recursos humanos</h1><p class="page-sub">Gestiona la plantilla de tu escudería y el mercado de fichajes.</p><span class="round-label" id="top"></span><main id="app"></main><p id="notice" role="status"></p><div class="demo"><label for="sel">Demo · ronda</label><select id="sel"></select></div></div><script>
"use strict";
(function(){
var RONDAS=[["Entrega de la escudería", "Declara tu estrategia y puja por pilotos"], ["Test oficial", "Llegan patrocinadores y fichajes"], ["6 Horas de Prometeo", "Tramo 1 · 0 a 3 h"], ["6 Horas de Prometeo", "Tramo 2 · 3 a 6 h"], ["12 Horas Quantum Race", "Tramo 1 · 0 a 6 h"], ["12 Horas Quantum Race", "Tramo 2 · 6 a 12 h"], ["6 Horas de las Ardenas", "Tramo 1 · 0 a 3 h"], ["6 Horas de las Ardenas", "Tramo 2 · 3 a 6 h"], ["Junta de patrocinadores", "Revisa el plan y el mercado de verano"], ["8 Horas de Eifel", "Tramo 1 · 0 a 4 h"], ["8 Horas de Eifel", "Tramo 2 · 4 a 8 h"], ["10 Horas del Atardecer", "Tramo 1 · 0 a 5 h"], ["10 Horas del Atardecer", "Tramo 2 · 5 a 10 h"], ["24 Horas del Mare Nostrum", "Preparación de la final"], ["24 Horas del Mare Nostrum", "Tramo 1 · 0 a 8 h"], ["24 Horas del Mare Nostrum", "Tramo 2 · 8 a 16 h"], ["24 Horas del Mare Nostrum", "Tramo 3 · 16 a 24 h"], ["Cierre del ejercicio", "Memoria y defensa ante el consejo"]];
var ROLES=['Jefe de equipo deportivo','Piloto','Ingenieros','Mecánicos'],LIMITES=[1,1,2,3];
var PERSONAS=[[0,'David Martín',0,15000],[1,'Álex Torres',1,12000],[2,'Sara Costa',2,8000],[3,'Mateo Rivas',2,8000],[4,'Hamza El Mansouri',3,4000],[5,'Júlia Serra',3,4000],[6,'Eric Molina',3,4000],[7,'Clara Navarro',1,11000],[8,'Pablo Rivas',2,9000],[9,'Nora Campos',3,4500],[10,'Elena Castro',0,16000]].map(function(p){return {id:p[0],nombre:p[1],grupo:p[2],salario:p[3]};});
var FOTOS=["assets/rrhh-01.webp", "assets/rrhh-02.webp", "assets/rrhh-03.webp", "assets/rrhh-04.webp", "assets/rrhh-05.webp", "assets/rrhh-06.webp", "assets/rrhh-07.webp", "assets/rrhh-08.webp", "assets/rrhh-09.webp", "assets/rrhh-10.webp", "assets/rrhh-11.webp"];
var OFICIOS=["Jefe de equipo deportivo", "Piloto", "Ingeniera", "Ingeniero", "Mecánico", "Mecánica", "Mecánico", "Piloto", "Ingeniero", "Mecánica", "Jefa de equipo deportivo"];
var decisiones={},cerradas={},editor=null;
try{decisiones=JSON.parse(localStorage.getItem('rrhh-decisiones')||'{}');cerradas=JSON.parse(localStorage.getItem('paddock-cerradas')||'{}');}catch(e){}
function $(s){return document.querySelector(s)}
function eur(n){return n.toLocaleString('es-ES',{useGrouping:'always'})+' €'}
function decision(n){if(!decisiones[n])decisiones[n]={salarios:{},despidos:{},ofertas:{}};return decisiones[n]}
function guardar(){try{localStorage.setItem('rrhh-decisiones',JSON.stringify(decisiones));}catch(e){}}
function total(list){return list.reduce(function(a,p){return a+p.salario},0)}
function plantilla(n){var list=PERSONAS.slice(0,7).map(function(p){return Object.assign({},p)}),respuestas=[];for(var r=1;r<n;r++){var d=decisiones[r],rs=[];if(d){list=list.filter(function(p){if(!d.despidos[p.id])return true;rs.push([p.nombre,'Despido aplicado']);return false});list.forEach(function(p){if(d.salarios[p.id]!==undefined){p.salario=d.salarios[p.id];rs.push([p.nombre,'Salario actualizado'])}});Object.keys(d.ofertas).forEach(function(id){var p=PERSONAS[+id],v=d.ofertas[id];if(!p||list.some(function(x){return x.id===p.id}))return;var hueco=list.filter(function(x){return x.grupo===p.grupo}).length<LIMITES[p.grupo];if(hueco&&v>=p.salario){list.push(Object.assign({},p,{salario:v}));rs.push([p.nombre,'Fichaje aceptado'])}else rs.push([p.nombre,hueco?'Oferta rechazada':'Sin plaza disponible'])})}if(r===n-1)respuestas=rs}return {list:list,respuestas:respuestas}}
function button(label,act,id,cls){return '<button class="'+(cls||'')+'" data-act="'+act+'" data-id="'+id+'">'+label+'</button>'}
function persona(p,d,mercado,n){var id=p.id,h='<div class="rr-person"><img class="rr-face" src="'+FOTOS[id]+'" alt="" width="64" height="64"><div class="rr-person-info"><b>'+p.nombre+'</b><small>'+OFICIOS[id]+' · '+eur(p.salario)+' / ronda</small>';if(d.salarios[id]!==undefined)h+='<span class="rr-pending">Nuevo salario: '+eur(d.salarios[id])+'</span>';if(d.despidos[id])h+='<span class="rr-pending">Despido pendiente</span>';if(d.ofertas[id]!==undefined)h+='<span class="rr-pending">Oferta: '+eur(d.ofertas[id])+'</span>';h+='</div><div class="actions">';if(n===18||cerradas[n])return h+'</div></div>';if(editor&&editor.id===id&&editor.mercado===mercado)h+='<input type="number" min="1" step="500" id="importe" value="'+(mercado?p.salario:(d.salarios[id]||p.salario))+'" aria-label="Importe">'+button('Guardar','guardar',id,'primary')+button('Cancelar','cancelar',id);else if(mercado)h+=d.ofertas[id]!==undefined?button('Retirar','retirar',id):button('Ofertar','ofertar',id,'primary');else if(d.despidos[id])h+=button('Cancelar','anular',id);else h+=button('Salario','salario',id)+button('Despedir','despedir',id,'danger');return h+'</div></div>'}
function render(n){var a=plantilla(n),list=a.list,d=decision(n);$('#top').textContent='Ronda '+n+' de 18 · '+(cerradas[n]?'Cerrada':n===18?'Cierre':'Abierta');var h='<div class="rr-stats"><div class="card"><small>Plantilla actual</small><b>'+list.length+' / 7</b><small>Empleados</small></div><div class="card"><small>Gastos de personal</small><b>'+eur(total(list))+'</b><small>Por ronda</small></div><div class="card"><small>Capital humano</small><b>50 / 100</b><small>Valor provisional</small></div></div><div class="rr-layout"><section class="card"><h2>Mi plantilla</h2>';
ROLES.forEach(function(rol,g){var grupo=list.filter(function(p){return p.grupo===g});h+='<div class="rr-group"><div class="rr-group-head"><div><b>'+rol+'</b><small>'+grupo.length+' / '+LIMITES[g]+' plazas</small></div><b>'+eur(total(grupo))+'</b></div>'+(grupo.length?grupo.map(function(p){return persona(p,d,false,n)}).join(''):'<p style="padding:12px;margin:0">Sin personal contratado.</p>')+'</div>'});h+='</section><div class="rr-right"><section class="card"><h2>Mercado de fichajes</h2><p class="rr-note">Los fichajes se resuelven en la siguiente ronda. Si no hay plazas libres, marca un despido antes de ofertar.</p>';var mercado=PERSONAS.filter(function(p){return !list.some(function(x){return x.id===p.id})});h+=mercado.map(function(p){return persona(p,d,true,n)}).join('')+'</section><section class="card"><h2>Respuestas a decisiones</h2>'+(a.respuestas.length?a.respuestas.map(function(x){return '<div class="rr-resp"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join(''):'<p class="rr-note">No hay nuevas respuestas en esta ronda.</p>')+'</section></div></div><div class="rr-alert">'+(cerradas[n]?'Ronda cerrada. No se pueden modificar decisiones.':list.length<7?'Hay plazas vacantes en tu plantilla.':n===18?'Cierre del ejercicio.':'Los cambios se aplican en la siguiente ronda.')+'</div><p class="rr-note">Datos de ejemplo: faltan las fórmulas de cálculo del simulador.</p>';$('#app').innerHTML=h}
var sel=$('#sel'),start=5;sel.innerHTML=RONDAS.map(function(r,i){return '<option value="'+(i+1)+'">'+(i+1)+' · '+r[0]+'</option>'}).join('');try{var v=+localStorage.getItem('ronda');if(v>=1&&v<=18)start=v}catch(e){}sel.value=start;sel.addEventListener('change',function(){editor=null;try{localStorage.setItem('ronda',sel.value)}catch(e){}$('#notice').textContent='';render(+sel.value)});$('#app').addEventListener('click',function(e){var b=e.target.closest('[data-act]'),n=+sel.value;if(!b||n===18||cerradas[n])return;var act=b.dataset.act,id=+b.dataset.id,d=decision(n),msg='';if(act==='salario'||act==='ofertar')editor={id:id,mercado:act==='ofertar'};if(act==='cancelar')editor=null;if(act==='guardar'){var v=$('#importe').valueAsNumber;if(!Number.isFinite(v)||v<=0){$('#notice').textContent='Introduce un importe válido.';return}if(editor.mercado){d.ofertas[id]=v;msg='Oferta guardada.'}else{d.salarios[id]=v;msg='Salario guardado.'}editor=null}if(act==='despedir'){d.despidos[id]=true;delete d.salarios[id];msg='Despido pendiente.';editor=null}if(act==='anular')delete d.despidos[id];if(act==='retirar')delete d.ofertas[id];guardar();render(n);$('#notice').textContent=msg});render(start);
})();</script><script src="menu.js"></script><script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
